name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @relaxgo/shared build
      - run: pnpm typecheck
      - name: API integration tests (in-memory Mongo replica set)
        run: pnpm --filter @relaxgo/api test
        env:
          RELAXGO_TEST_DBPATH: ${{ runner.temp }}/mongo-mem
